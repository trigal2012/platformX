

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errorMsg = `
        🛑 SYSTEM UNCAUGHT ERROR:
        Message: ${message}
        File: ${source.split('/').pop()}
        Line: ${lineno}:${colno}
        Stack: ${error ? error.stack.split('\n')[1] : 'N/A'}
      `;
      alert(errorMsg);
      
      // Secondary Fallback: Force injection into layout stage if available
      setTimeout(() => {
        const stage = document.getElementById('game-stage') || document.getElementById('game-list');
        if (stage) {
          stage.innerHTML = `
            <div style="background:#4c0519; color:#fda4af; padding:16px; border:1px solid #9f1239; border-radius:12px; margin:16px 0; font-family:monospace; font-size:11px; white-space:pre-wrap; text-align:left;">
              <strong>Global Error Intercepted:</strong>\n${errorMsg}
            </div>
          ` + stage.innerHTML;
        }
      }, 500);
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      const errorMsg = `⚠️ UNHANDLED PROMISE REJECTION:\n${event.reason}`;
      alert(errorMsg);
    });
  </script>
  <title>EduGames Orchestration Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
  
  <header class="bg-indigo-600 text-white py-6 px-4 shadow-md text-center">
    <h1 class="text-2xl font-bold tracking-tight">Micro-Econ Arcade</h1>
    <p class="text-xs text-indigo-200 mt-1">One single-objective concept at a time.</p>
  </header>

  <main class="max-w-md mx-auto w-full px-4 py-8 flex-grow">
    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Select a Module Test:</h2>
    <div id="game-list" class="space-y-4">
      <p class="text-sm text-slate-400 animate-pulse">Loading modules...</p>
    </div>
  </main>

  <footer class="text-center py-4 text-[10px] text-slate-400 bg-slate-100 border-t border-slate-200 uppercase tracking-widest">
    EduGames Framework PoC
  </footer>

  <script>
    // Fetch game metadata from JSON file database
    fetch('./games.json?v'=Date.now())
      .then(res => res.json())
      .then(games => {
        const listContainer = document.getElementById('game-list');
        listContainer.innerHTML = ''; // Clear out loading placeholder
        
        games.forEach(game => {
          const card = document.createElement('a');
          // This appends the unique game id as a URL parameter
          card.href = search`./game.html?id=${game.id}`;
          card.className = "block bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 transition active:scale-[0.98]";
          card.innerHTML = `
            <div class="text-[10px] font-bold text-indigo-600 uppercase tracking-wider mb-1">${game.concept}</div>
            <h3 class="text-lg font-bold text-slate-900">${game.title}</h3>
            <p class="text-xs text-slate-500 mt-2 leading-relaxed">${game.prompt.substring(0, 90)}...</p>
            <div class="mt-4 text-xs font-bold text-indigo-600 flex items-center justify-end">LAUNCH MODULE &rarr;</div>
          `;
          listContainer.appendChild(card);
        });
      })
      .catch(err => console.error("Error loading games:", err));
  </script>
</body>
</html>
